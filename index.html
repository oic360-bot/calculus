<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math in Motion</title>
<style>
:root{color-scheme:light;--bg:#e9eef5;--card:#fbfcfe;--ink:#121826;--muted:#5a667c;--line:#d3dbe8;--c1:#2563eb;--c2:#e11d74;--c3:#0f9d8a;--c4:#6d4aff;--tint:#e6eeff;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c111b;--card:#121927;--ink:#e8edf7;--muted:#93a0b8;--line:#26314a;--c1:#6ea0ff;--c2:#ff6fa8;--c3:#2fd3bd;--c4:#a592ff;--tint:#182340;--on:#0b1020}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c111b;--card:#121927;--ink:#e8edf7;--muted:#93a0b8;--line:#26314a;--c1:#6ea0ff;--c2:#ff6fa8;--c3:#2fd3bd;--c4:#a592ff;--tint:#182340;--on:#0b1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 36px}
h1{font:700 clamp(30px,7vw,44px)/1.05 "Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:14px;max-height:236px;overflow-y:auto;padding:2px}nav button[hidden]{display:none}
.tools{margin-bottom:12px}
#q{width:100%;min-height:44px;padding:0 14px;margin-bottom:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;appearance:none;-webkit-appearance:none}
#q::placeholder{color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.cats button span{margin-left:6px;font-weight:500;opacity:.65}
.cats button[aria-pressed=true]{background:var(--c1);border-color:var(--c1);color:var(--on)}
.tags{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c3);margin-bottom:4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;min-height:44px;background:var(--card);color:var(--muted);border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
nav button svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected=true]{color:var(--c1);border-color:var(--c1);background:var(--tint)}
button:focus-visible,input:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
canvas{display:block;width:100%;touch-action:pan-y}
canvas.drag{touch-action:none;cursor:grab}
.info{padding:16px 18px 4px;border-top:1px solid var(--line)}
.info h2{font:700 22px/1.2 "Avenir Next","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em;margin:0 0 8px}
.formula{display:inline-block;font:600 17px ui-monospace,Menlo,Consolas,monospace;background:var(--tint);color:var(--c1);padding:4px 10px;border-radius:8px;margin-bottom:8px}
.info p{margin:0 0 12px;color:var(--muted);max-width:68ch}
.read{min-height:3.2em;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;background:var(--bg);border-radius:10px;margin:0 0 14px}
.k1{color:var(--c1)}.k2{color:var(--c2)}.k3{color:var(--c3)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 18px 16px}
.ctl button{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.ctl button.p{background:var(--c1);border-color:var(--c1);color:var(--on)}
.ctl label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
input[type=range]{accent-color:var(--c1);min-height:44px}
#tl{flex:1 1 160px;min-width:120px}
#sp{width:90px}
</style>
</head>
<body>
<div class="wrap">
<h1>Math in Motion</h1>
<noscript><p class="sub"><b>The animations need JavaScript.</b> This looks like a file preview. Open the file in a web browser such as Safari, Chrome or Firefox instead.</p></noscript>
<p class="sub">Pick a theorem and watch it unfold.</p>
<div class="tools">
<input id="q" type="search" placeholder="Search animations" aria-label="Search animations" autocomplete="off">
<div class="cats" id="cats" role="group" aria-label="Categories"></div>
</div>
<nav id="nav" role="tablist" aria-label="Theorems">
<button role="tab" aria-selected="true"><svg viewBox="0 0 30 30"><path d="M5 25V6l20 19z"/><path d="M5 20h5v5"/></svg>Pythagorean</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M6 6h18v18H6z"/><path d="M6 16c3-2.5 6 2.5 9 0s6-2.5 9 0V24H6z" fill="currentColor" fill-opacity=".25"/></svg>Water demo</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M3 25h24"/><circle cx="11" cy="19" r="6"/><path d="M13 25c1-15 10-15 13-1" stroke-dasharray="2 3"/></svg>Cycloid</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M3 15h24" opacity=".35"/><path d="M3 15C7 2 11 2 15 15s8 13 12 0"/></svg>Sine wave</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11"/><path d="M2 15h26M15 2v26" opacity=".35"/><path d="M15 15l8-8"/><circle cx="23" cy="7" r="1.8" fill="currentColor"/></svg>Unit circle</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11"/><path d="M15 4l9.5 5.5v11L15 26l-9.5-5.5v-11z"/></svg>Calculating π</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><rect x="4" y="4" width="22" height="22" rx="2"/><circle cx="15" cy="15" r="11"/><g fill="currentColor" stroke="none"><circle cx="12" cy="11" r="1.3"/><circle cx="18" cy="17" r="1.3"/><circle cx="14" cy="20" r="1.3"/><circle cx="6.5" cy="6.5" r="1.3"/><circle cx="23.5" cy="22.5" r="1.3"/></g></svg>Monte Carlo</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M3 25C14 24 21 19 26 5"/><path d="M10.6 27L25.8 10.2" opacity=".6"/><circle cx="18.9" cy="17.8" r="2" fill="currentColor"/></svg>Derivative eˣ</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 26h22" opacity=".4"/><path d="M4 18C9 8 15 22 26 8"/><path d="M4 18C7 12 10 11 14 15.5V26H4z" fill="currentColor" fill-opacity=".25" stroke="none"/></svg>Fundamental theorem</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 26h22" opacity=".4"/><path d="M5 21h5v5H5zM10 18h5v8h-5zM15 14h5v12h-5zM20 9h5v17h-5z"/><path d="M5 22C12 20 19 13 26 6" opacity=".6"/></svg>Riemann sum</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 10C9 3 12 11 15 8S22 4 26 7"/><path d="M4 14Q15 24 26 14" opacity=".7"/><path d="M4 27L26 21" opacity=".5"/></svg>f, f′, f″</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M3 15Q9 -5 15 15T27 15"/><path d="M3 5C9 5 9 25 15 25S21 5 27 5" opacity=".6" stroke-dasharray="2 3"/></svg>Derivative sin x</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M5 8l5 1.5M13 8l5 3M21 8l4 4M5 15l5 .5M13 15l5 2M21 15l4 3M5 22l5-1.5M13 22l5 .5M21 22l4 2"/><path d="M3 25C10 25 17 12 27 5" opacity=".55"/></svg>Slope field</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M5 4v22h22" opacity=".5"/><path d="M6 7L22 25"/><path d="M9 8.5l-2.5 2.5M13.5 13.5L11 16M18 18.5L15.5 21" opacity=".7"/></svg>Related rates</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 25C12 25 21 18 27 5"/><path d="M10 27L28 14" opacity=".6"/><circle cx="17" cy="21" r="1.8" fill="currentColor"/></svg>Tangent line</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 24C10 6 14 26 27 8"/><path d="M4 24L27 8" opacity=".5" stroke-dasharray="2 3"/><path d="M11 13L21 6" opacity=".8"/></svg>Mean value theorem</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 24C12 24 16 6 27 6"/><path d="M3 15h24" stroke-dasharray="2 3" opacity=".6"/><circle cx="15.5" cy="15" r="2" fill="currentColor"/></svg>Intermediate value</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 20C8 6 14 6 17 16S24 24 27 10"/><path d="M3 5h24M3 26h24" stroke-dasharray="2 3" opacity=".6"/></svg>Extreme value</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><rect x="3" y="10" width="15" height="10" rx="5"/><rect x="12" y="10" width="15" height="10" rx="5"/></svg>Chain rule</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M5 22a10 10 0 0 1 20 0"/><path d="M15 22l5-8"/><path d="M4 26h22" opacity=".5"/></svg>Bolt: speed</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M3 15Q9 -5 15 15T27 15" opacity=".5"/><path d="M7 25C11 21 13 15 15 15S19 9 23 5"/></svg>Taylor series</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M5 5h20L15 26z"/><path d="M9.5 12h11L15 22.5z" fill="currentColor" fill-opacity=".3" stroke="none"/></svg>Cone rates</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 27h23" opacity=".5"/><path d="M6 27V6"/><circle cx="6" cy="5.5" r="2.2" fill="currentColor"/><path d="M16 27v-7"/><circle cx="16" cy="18" r="1.7" fill="currentColor"/><path d="M16 27h10" stroke-width="3" opacity=".55"/><path d="M6 6L26 27" opacity=".4" stroke-dasharray="2 3"/></svg>Lamp shadow</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M6 5Q15 25 24 5"/><path d="M3 24h24" stroke-dasharray="2 3" opacity=".6"/><circle cx="15" cy="10" r="1.8" fill="currentColor"/></svg>Parabola</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><ellipse cx="15" cy="15" rx="12" ry="8"/><circle cx="9.5" cy="15" r="1.7" fill="currentColor"/><circle cx="20.5" cy="15" r="1.7" fill="currentColor"/><path d="M9.5 15L15 7l5.5 8" opacity=".6"/></svg>Ellipse</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M4 5L26 25M4 25L26 5" opacity=".5" stroke-dasharray="2 3"/><path d="M27 4Q17 15 27 26M3 4Q13 15 3 26"/></svg>Hyperbola</button>
<button role="tab" aria-selected="false"><svg viewBox="0 0 30 30"><path d="M15 25C5 23 4 11 10 9C13 8 15 10 15 12C15 10 17 8 20 9C26 11 25 23 15 25Z"/><path d="M15 15L27 6" opacity=".5"/><circle cx="15" cy="15" r="1.6" fill="currentColor"/></svg>Polar graphs</button>
</nav>
<p class="sub" id="none" hidden>No animations match. Try another category or search.</p>
<div class="stage">
<canvas id="cv" role="img" aria-label="Animated math diagram"></canvas>
<div class="info">
<div class="tags" id="tg"></div>
<h2 id="ti"></h2>
<div class="formula" id="fo"></div>
<p id="de"></p>
<div class="read" id="rd"></div>
</div>
<div class="ctl">
<button class="p" id="pp">❚❚ Pause</button>
<button id="rs">↺ Restart</button>
<input type="range" id="tl" min="0" max="1000" value="0" aria-label="Timeline">
<label>Speed <input type="range" id="sp" min="0.25" max="2" step="0.25" value="1"><span id="spv">1×</span></label>
</div>
</div>
</div>
<script>
(()=>{
const TAU=Math.PI*2,cv=document.getElementById('cv'),c=cv.getContext('2d'),$=id=>document.getElementById(id);
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ss=t=>t*t*(3-2*t);
const f3=v=>(Math.abs(v)<5e-4?0:v).toFixed(3);
let W=0,H=0,dpr=1,cur=0,T=0,playing=true,speed=1,last=0,lastRead='',drag=false;

function fit(){const w=cv.parentElement.clientWidth;if(!w)return;dpr=Math.min(window.devicePixelRatio||1,2);W=w;H=Math.round((w<560?w*.95:Math.min(w*.56,470))*(typeof S[cur].tall==='function'?S[cur].tall(w):(S[cur].tall||1)));cv.style.height=H+'px';cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
function colors(){const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();return{ink:g('--ink'),muted:g('--muted'),line:g('--line'),card:g('--card'),c1:g('--c1'),c2:g('--c2'),c3:g('--c3'),c4:g('--c4')}}

const ln=(x1,y1,x2,y2,col,w=2,d)=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=w;c.setLineDash(d||[]);c.stroke();c.setLineDash([])};
const dot=(x,y,r,col,ring)=>{c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=col;c.fill();if(ring){c.strokeStyle=ring;c.lineWidth=2;c.stroke()}};
const tx=(s,x,y,col,sz=14,al='center')=>{c.font='600 '+sz+'px system-ui,sans-serif';c.fillStyle=col;c.textAlign=al;c.textBaseline='middle';c.fillText(s,x,y)};
const circ=(x,y,r,col,w=2)=>{c.beginPath();c.arc(x,y,r,0,TAU);c.strokeStyle=col;c.lineWidth=w;c.stroke()};
const path=(n,fn,col,w,dash)=>{c.beginPath();for(let i=0;i<=n;i++){const p=fn(i/n);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])}c.strokeStyle=col;c.lineWidth=w;c.setLineDash(dash||[]);c.stroke();c.setLineDash([])};

function grid(k){c.globalAlpha=.45;for(let x=0;x<W;x+=28)ln(x,0,x,H,k.line,1);for(let y=0;y<H;y+=28)ln(0,y,W,y,k.line,1);c.globalAlpha=1}

/* 1 · Pythagorean theorem: the rearrangement proof */
const cen=p=>[(p[0][0]+p[1][0]+p[2][0])/3,(p[0][1]+p[1][1]+p[2][1])/3];
const FROM=[[[0,0],[3,0],[0,4]],[[7,0],[7,3],[3,0]],[[7,7],[4,7],[7,3]],[[0,7],[0,4],[4,7]]];
const TO=[[[0,3],[3,3],[0,7]],[[7,0],[7,3],[3,0]],[[3,7],[0,7],[3,3]],[[3,3],[3,0],[7,3]]];
function pyth(k){
 const a=3,b=4,s=7,S=Math.min(H-36,W-32,430),u=S/s,ox=(W-S)/2,oy=(H-S)/2;
 const ph=T<.5?T*2:2-T*2,e=ss(clamp((ph-.15)/.7));
 const P=(x,y)=>[ox+x*u,oy+y*u];
 const poly=(pts,fill,al,st)=>{c.beginPath();pts.forEach((p,i)=>{const q=P(p[0],p[1]);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1])});c.closePath();if(fill){c.globalAlpha=al;c.fillStyle=fill;c.fill();c.globalAlpha=1}if(st){c.strokeStyle=st;c.lineWidth=2;c.stroke()}};
 poly([[0,0],[s,0],[s,s],[0,s]],k.muted,.08,k.line);
 poly([[a,0],[s,a],[b,s],[0,b]],k.c3,(1-e)*.5);
 poly([[0,0],[a,0],[a,a],[0,a]],k.c1,e*.55);
 poly([[a,a],[s,a],[s,s],[a,s]],k.c2,e*.55);
 FROM.forEach((p,i)=>{
  const q=TO[i],cp=cen(p),cq=cen(q);
  let th=Math.atan2(q[1][1]-q[0][1],q[1][0]-q[0][0])-Math.atan2(p[1][1]-p[0][1],p[1][0]-p[0][0]);
  th=((th+Math.PI)%TAU+TAU)%TAU-Math.PI;
  const f=th*e,co=Math.cos(f),si=Math.sin(f),mx=lerp(cp[0],cq[0],e),my=lerp(cp[1],cq[1],e);
  const v=p.map(z=>{const x=z[0]-cp[0],y=z[1]-cp[1];return[mx+x*co-y*si,my+x*si+y*co]});
  poly(v,k.c4,.85,k.card);
  const R=v[0],A=v[1],B=v[2],nA=Math.hypot(A[0]-R[0],A[1]-R[1]),nB=Math.hypot(B[0]-R[0],B[1]-R[1]);
  const ax=(A[0]-R[0])/nA*.5,ay=(A[1]-R[1])/nA*.5,bx=(B[0]-R[0])/nB*.5,by=(B[1]-R[1])/nB*.5;
  const m1=P(R[0]+ax,R[1]+ay),m2=P(R[0]+ax+bx,R[1]+ay+by),m3=P(R[0]+bx,R[1]+by);
  c.beginPath();c.moveTo(m1[0],m1[1]);c.lineTo(m2[0],m2[1]);c.lineTo(m3[0],m3[1]);c.strokeStyle=k.card;c.lineWidth=1.5;c.stroke();
 });
 const lab=(t,x,y,al)=>{const q=P(x,y);c.globalAlpha=al;tx(t,q[0],q[1],k.ink,Math.max(16,u*.5));c.globalAlpha=1};
 lab('c²',3.5,3.5,1-e);lab('a²',1.5,1.5,e);lab('b²',5,5,e);
 return e<.5?'3-4-5 triangles · empty space = <span class="k3">c² = 5² = 25</span>':'3-4-5 triangles · empty space = <span class="k1">a² = 9</span> + <span class="k2">b² = 16</span> = 25 = c²';
}

/* 2 · Cycloid */
function cyc(k){
 const r=Math.min((W-44)/(TAU+2),H*.27),g=H*.8,x0=(W-TAU*r)/2,th=TAU*clamp(T/.88);
 const pt=t=>[x0+r*(t-Math.sin(t)),g-r*(1-Math.cos(t))];
 ln(14,g,W-14,g,k.muted,2);
 path(120,t=>pt(TAU*t),k.line,2,[5,6]);
 path(Math.max(2,Math.ceil(th/TAU*160)),t=>pt(th*t),k.c2,3.5);
 const cx=x0+r*th,cy=g-r,px=cx-r*Math.sin(th),py=cy+r*Math.cos(th);
 ln(x0,g,cx,g,k.c1,4);dot(cx,g,4.5,k.c1);
 c.beginPath();c.arc(cx,cy,r,0,TAU);c.globalAlpha=.1;c.fillStyle=k.c1;c.fill();c.globalAlpha=1;c.strokeStyle=k.ink;c.lineWidth=2;c.stroke();
 ln(cx,cy,px,py,k.ink,2);dot(cx,cy,3.5,k.ink);dot(px,py,7,k.c2,k.card);
 return 'θ = <b>'+Math.round(th*180/Math.PI)+'°</b> · x = r(θ − sin θ) = <span class="k1">'+(th-Math.sin(th)).toFixed(2)+'r</span> · y = r(1 − cos θ) = <span class="k2">'+(1-Math.cos(th)).toFixed(2)+'r</span>';
}

/* 3 · Sine wave */
function sine(k){
 const R=Math.min(H*.32,W*.15),cx=R+26,cy=H/2,x0=cx+R+40,x1=W-18,kx=(x1-x0)/TAU,th=TAU*clamp(T/.92);
 ln(10,cy,x1+8,cy,k.muted,1.5);ln(cx,cy-R-14,cx,cy+R+14,k.line,1.5);
 [[.5,'π/2'],[1,'π'],[1.5,'3π/2'],[2,'2π']].forEach(m=>{const x=x0+m[0]*Math.PI*kx;ln(x,cy-R,x,cy+R,k.line,1,[3,4]);tx(m[1],x,cy+R+24,k.muted,12)});
 circ(cx,cy,R,k.muted,2);
 path(120,t=>[x0+t*TAU*kx,cy-R*Math.sin(t*TAU)],k.line,2,[5,6]);
 path(Math.max(2,Math.ceil(th/TAU*160)),t=>[x0+t*th*kx,cy-R*Math.sin(t*th)],k.c2,3.5);
 const px=cx+R*Math.cos(th),py=cy-R*Math.sin(th),wx=x0+th*kx;
 c.beginPath();c.arc(cx,cy,R*.22,0,-th,true);c.strokeStyle=k.c3;c.lineWidth=2.5;c.stroke();
 ln(cx,cy,px,py,k.ink,2);ln(px,cy,px,py,k.c1,3.5);ln(px,py,wx,py,k.c2,1.5,[4,4]);
 dot(px,py,7,k.c4,k.card);dot(wx,py,6,k.c2,k.card);
 return 'θ = <b>'+Math.round(th*180/Math.PI)+'°</b> ('+(th/Math.PI).toFixed(2)+'π) · height = sin θ = <span class="k2">'+f3(Math.sin(th))+'</span>';
}

/* 4 · Unit circle */
function unit(k){
 const R=Math.min(H*.34,W*.26),cx=W/2,cy=H/2,th=TAU*T,co=Math.cos(th),si=Math.sin(th),px=cx+R*co,py=cy-R*si;

const S=[
 {t:'Pythagorean theorem',f:'a² + b² = c²',d:'Four identical right triangles fill a square of side a + b. Rearrange them and the leftover space changes from one square (c²) into two squares (a² and b²). The triangles never change size, so the areas must match.',dur:10,c:['Geometry','Trigonometry'],run:pyth},
 {t:'Pythagorean water demo',f:'a² + b² = c²',d:'The board flips over and gravity does the work. With the large square below, the water from both small squares pours into it and fills it exactly. Flip the board back and the large square empties into the two small ones. Use the timeline to pause on any moment.',dur:14,c:['Geometry'],run:waterSpin},
 {t:'Cycloid',f:'x = r(θ − sin θ),  y = r(1 − cos θ)',d:'The path of a point on the rim of a wheel rolling along a line. One arch is 2πr wide and 2r tall, its length is exactly 8r, and the area beneath it is 3πr², three times the area of the wheel.',dur:8,c:['Geometry','Calculus'],run:cyc},
 {t:'Sine wave',f:'y = sin θ',d:'A point moving around a circle at constant speed rises and falls in a smooth rhythm. Plot its height against the angle and you get the sine wave. One full turn, 2π radians, makes one full wave.',dur:8,c:['Trigonometry'],run:sine},
 {t:'Unit circle',f:'cos² θ + sin² θ = 1',d:'On a circle of radius 1, the point at angle θ sits at (cos θ, sin θ). The tangent line at (1, 0) meets the extended radius at height tan θ. Drag the point or use the timeline to explore any angle.',dur:14,c:['Trigonometry'],run:unit},
 {t:'Calculating π with polygons',f:'n·sin(π/n) < π < n·tan(π/n)',d:'Archimedes trapped the circle between two polygons. The inside polygon is shorter than the circle and the outside one is longer, so π sits between their half-perimeters. Each time the number of sides doubles, the gap shrinks. With 96 sides he proved that 3 10/71 < π < 3 1/7.',dur:16,c:['Geometry','Pi'],run:archi},
 {t:'Monte Carlo estimate of π',f:'π ≈ 4 × (darts in circle) ÷ (all darts)',d:'Throw random darts at a square with a circle inside it. The circle covers π/4 of the square, so four times the fraction of darts that land inside the circle estimates π. The estimate wobbles at first and slowly settles as more darts land.',dur:14,c:['Probability','Pi'],run:mc},
 {t:'The derivative of eˣ',f:'d/dx eˣ = eˣ',d:'The curve y = eˣ has a special property: at every point, the slope of the tangent line equals the height of the curve. First shrink h and the secant slope (eʰ − 1) ÷ h settles at 1 when x = 0. Then slide along the curve. The slope you measure always matches the height, so the slope curve is the same curve.',dur:18,c:['Calculus'],run:expd},
 {t:'The fundamental theorem of calculus',f:'d/dx ∫ f(t) dt = f(x)',d:'Slide x along the curve and shade the area under f from 0 to x. Call that area A(x). Adding a thin slice of width Δx adds about f(x) × Δx of area, so A grows at the rate f(x): the slope of A always equals the height of f. That is the first half of the theorem. The second half follows: the total area from a to b is A(b) − A(a).',dur:18,c:['Calculus'],run:ftc},
 {t:'Riemann sums',f:'Σ f(x)·Δx → ∫ f(x) dx',d:'Estimate the area under a curve by filling it with thin rectangles. The blue rectangles use the left edge of each slice and sit under the curve, so they underestimate the area. The pink outlines use the right edge and overshoot. Each time the number of rectangles doubles, the two sums squeeze closer to the exact area, 22/3. In the limit, that is the definite integral.',dur:16,c:['Calculus'],run:riem},
 {t:'f, f′ and f″ compared',f:'f′(x) = (x + 1.5)(x + 0.5)(x − 1)²',d:'The top graph is f. The middle graph is its slope, f′, and the bottom graph is how fast that slope changes, f″. Colors tell the story: where f′ is positive, f rises (teal), and where f′ is negative, f falls (pink). This curve peaks, dips into a valley, climbs, then goes almost flat at x = 1 before rising again. There f′ touches zero but never crosses it, so f levels off without turning around. Where f″ crosses zero, f changes how it bends.',dur:18,tall:1.25,c:['Calculus'],run:deriv3},
 {t:'The derivative of sine is cosine',f:'d/dx sin x = cos x',d:'Watch the tangent line slide along the sine wave. Its slope is largest and positive where the wave climbs fastest, zero at every peak and valley, and negative where the wave falls. Plot those slopes and you get the cosine curve. Another way to see it: a point moving around a circle has height sin x, and how fast that height changes is the vertical part of its velocity, which is cos x.',dur:16,c:['Calculus','Trigonometry'],run:dsin},
 {t:'Slope fields',f:'dy/dx = x − y',d:'A differential equation such as dy/dx = x − y gives the slope of a solution curve at every point, even before you know the curve. Each little line is that slope: teal means rising and pink means falling. Now choose a starting point and follow the lines. The solution is a curve that stays tangent to the field. Different starting points give different curves, but here they all settle onto one straight line, y = x − 1.',dur:20,c:['Calculus','Differential equations'],run:slopef},
 {t:'Related rates: the sliding ladder',f:'x² + y² = 10²  →  dy/dt = −(x ÷ y) × dx/dt',d:'A 10-foot ladder leans against a wall while its bottom slides away at a steady 2 ft/s. The Pythagorean theorem links the two distances: x² + y² = 10². Differentiating both sides with respect to time gives 2x(dx/dt) + 2y(dy/dt) = 0, so the top moves at dy/dt = −(x ÷ y)(dx/dt). At first the top barely moves. Then it plunges faster and faster, matches the bottom\u2019s speed when x = y, and speeds off without limit as x approaches 10.',dur:14,c:['Calculus'],run:ladder},
 {t:'The tangent line problem',f:'f′(x) = lim [f(x + h) − f(x)] ÷ h, as h → 0',d:'How do you find the slope of a curve at a single point? One point is not enough to draw a line, so pick a second point Q on the curve and draw the secant line through P and Q. Slide Q toward P and the secant swings toward a limiting position: the tangent line. For f(x) = x²/2 at x = 1.5 the secant slope is 1.5 + h/2. Coming from the right, h shrinks through 2, 1, 0.5 and so on, and the slopes drop toward 1.5. Coming from the left, they climb toward 1.5. Both sides agree, so the tangent slope is exactly 1.5.',dur:18,c:['Calculus'],run:tangent},
 {t:'The mean value theorem',f:'f′(c) = [f(b) − f(a)] ÷ (b − a)',d:'Draw the secant line from (a, f(a)) to (b, f(b)). Its slope m is the average rate of change of f over the whole interval. The mean value theorem says that somewhere between a and b the tangent line must have exactly that slope, so it is parallel to the secant. Slide the tangent along the curve and watch for the moment it turns green. For this curve it happens twice, at c₁ ≈ 0.634 and c₂ ≈ 2.366. The bottom graph shows why: f′ starts and ends above m but dips below it in between, so it has to cross m.',dur:20,c:['Calculus'],run:mvt},
 {t:'The intermediate value theorem',f:'f continuous, f(a) < N < f(b)  →  f(c) = N for some c',d:'If f is continuous on [a, b], it takes every value between f(a) and f(b). Here f(a) = −2 is below N = 1 and f(b) = 4.05 is above it. A continuous curve has no gaps or jumps, so as the pencil slides from a to b it has to cross the line y = N at least once. This curve crosses it three times. The same idea gives the bisection method: test the midpoint, keep whichever half still has one end below N and the other above, and repeat. Each halving traps a crossing in a smaller bracket.',dur:22,c:['Calculus'],run:ivt},
 {t:'The extreme value theorem',f:'f continuous on [a, b]  →  f has an absolute max and min',d:'The extreme value theorem says that a continuous function on a closed interval [a, b] always has a highest and a lowest value. Lower a ceiling until it just touches the curve, and raise a floor the same way: that finds the absolute max and min. In the first example the maximum sits at an endpoint and the minimum sits inside. Then see why both conditions matter. On an open interval the curve can climb toward a value it never reaches. And if the function is not continuous, it can shoot up without limit, so no ceiling is high enough.',dur:24,c:['Calculus'],run:evt},
 {t:'The chain rule',f:'dy/dx = (dy/du) × (du/dx)',d:'The chain rule handles a function inside a function. Here y = sin u and u = x²/2, so y = sin(x²/2). A small change in x changes u by du/dx = x times as much, and that change in u changes y by dy/du = cos u times as much. The rates multiply: dy/dx = cos(u) × x. Watch the three tangent slopes as x moves. The teal slope on the composite curve is always the product of the blue slope on the inner function and the pink slope on the outer function. When either factor is zero, the whole slope is zero.',dur:20,tall:w=>w<560?1.45:1,c:['Calculus'],run:chain},
 {t:'Usain Bolt: actual speed vs average speed',f:'average speed = distance ÷ time = 100 m ÷ 9.58 s = 10.44 m/s',d:'In his 9.58 s world record in Berlin in 2009, Usain Bolt’s average speed was 100 m ÷ 9.58 s = 10.44 m/s. But he never ran at that speed the whole way. A runner who moves at that steady pace from the gun leads early, because Bolt starts from rest and has to accelerate. Then Bolt passes 10.44 m/s, peaks at about 12.4 m/s, and catches the steady runner exactly at the finish line. The speed graph shows why: the area under the curve is the distance, so the pink area below the average line must equal the teal area above it. The speed curve is estimated from the official 10 m split times, and the race is slowed down about 1.5 times.',dur:16,tall:w=>w<560?1.2:1,c:['Calculus','Real-world'],run:bolt100},
 {t:'Taylor polynomials hugging a curve',f:'sin x = x − x³/3! + x⁵/5! − x⁷/7! + …',d:'A Taylor polynomial uses only the derivatives of a function at one point, here x = 0, to build a polynomial that copies the function. Each extra term matches one more derivative, so the polynomial bends to hug the curve over a wider stretch around the center. Watch the pink polynomials for sin x grow term by term: x, then x − x³/3!, then add x⁵/5!, and so on. The teal band shows where the polynomial stays within 0.05 of the true curve. It keeps widening, but far from the center the polynomial always flies away, because a polynomial cannot oscillate forever. The second half does the same for cos x.',dur:30,c:['Calculus','Series'],run:taylor},
 {t:'Related rates: filling a cone',f:'V = (π/12)h³  →  dh/dt = 80 ÷ (πh²)',d:'Water is poured into an inverted cone, 12 ft tall and 12 ft across the top, at a steady 20 ft³/min. The radius is always half the height, so the volume is V = (1/3)πr²h = (π/12)h³. Differentiating with respect to time gives dV/dt = (π/4)h² × dh/dt, so the level rises at dh/dt = 80 ÷ (πh²). The inflow never changes, but the level rises more and more slowly: each extra foot of height needs a wider slice of water, so the same flow fills it more slowly.',dur:20,tall:w=>w<560?1.45:1,c:['Calculus','Geometry'],run:cone},
 {t:'Related rates: lamp post and shadow',f:'(x + s) ÷ 15 = s ÷ 6   →   ds/dt = (2/3) dx/dt',d:'A 6 ft tall person walks away from a 15 ft lamp post at 5 ft/s. The light ray that just grazes the top of the person\u2019s head makes two similar triangles, so (x + s) ÷ 15 = s ÷ 6, which simplifies to s = (2/3)x. Taking the derivative with respect to time, the shadow grows at ds/dt = (2/3)(5) = 3.33 ft/s. The tip of the shadow sits at x + s = (5/3)x from the post, so it moves at (5/3)(5) = 8.33 ft/s, faster than the person. In this problem every rate stays constant, so the graph shows straight lines.',dur:16,tall:w=>w<560?1.4:1,c:['Calculus','Geometry'],run:lamp},
 {t:'The parabola: conic section, focus and directrix',f:'PF = PD   ·   y = x² ÷ (4p)',d:'A parabola is what you get when you slice a cone with a plane that is exactly parallel to the cone\u2019s side. Start with a flat cut, which is a circle. Tilt the plane and the cut becomes an ellipse that stretches longer, and at the exact tilt of the cone\u2019s side it opens up into a parabola. Tilt further and it becomes a hyperbola. The same curve has a second description: it is every point that is the same distance from a fixed point, the focus, as from a fixed line, the directrix. Slide P along the curve and the two distances stay equal. The vertex sits exactly halfway between the focus and the directrix, so when the focus moves, the directrix moves with it.',dur:30,tall:w=>w<560?1.25:1,c:['Geometry','Conic sections'],run:parab},
 {t:'The ellipse and its foci',f:'PF\u2081 + PF\u2082 = 2a   \u00b7   b\u00b2 + c\u00b2 = a\u00b2',d:'An ellipse is what you draw with two pins and a loop of string. Push the pins into the paper at the two foci, hook the string around them, pull it taut with a pencil and trace all the way around. The pencil always makes two string segments, PF\u2081 and PF\u2082, and wherever it is their sum is the constant string length, 2a. That is the definition: an ellipse is every point whose distances to the two foci add up to the same number. Now keep the string the same length and slide the pins. With the foci together at the center you get a circle, and as they move apart the ellipse flattens. The center, a focus and the top of the ellipse always form a right triangle with b\u00b2 + c\u00b2 = a\u00b2, so the eccentricity e = c \u00f7 a measures how far the ellipse is from a circle.',dur:28,c:['Geometry','Conic sections'],run:ellipseScene},
 {t:'The hyperbola: asymptotes and foci',f:'|PF\u2081 \u2212 PF\u2082| = 2a   \u00b7   c\u00b2 = a\u00b2 + b\u00b2',d:'A hyperbola x\u00b2/a\u00b2 \u2212 y\u00b2/b\u00b2 = 1 is built around a rectangle with half-width a and half-height b. The rectangle\u2019s diagonals, extended in both directions, are the asymptotes, the lines the two branches approach forever without touching. A circle through the rectangle\u2019s corners cuts the x-axis at the foci, so the distance from the center to a focus is c, with c\u00b2 = a\u00b2 + b\u00b2. The foci are what define the curve: for every point on either branch, the distances to the two foci differ by exactly 2a. The pink line from P to the nearest asymptote shrinks as P moves out. At the end, b changes: the asymptotes tilt, the foci slide away from the center and the eccentricity e = c \u00f7 a grows as the branches open wider.',dur:32,c:['Geometry','Conic sections'],run:hyper},
 {t:'From a trig equation to a polar graph',f:'(x, y) = (r cos θ, r sin θ)',d:'A polar equation gives a distance r for every angle θ. To graph r = 1 + cos θ, turn a ray to the angle θ, measure r along it and mark the point. The left graph plots r against θ like any ordinary function, and the right graph wraps the same information around the origin. Where r is large the point is far out, and where r reaches 0 the curve touches the center. Where r turns negative, shown in pink, the point is plotted on the opposite side of the origin. That is how the limaçon gets its inner loop and how the rose gets its other petals. The tracing point always lands at (x, y) = (r cos θ, r sin θ).',dur:30,tall:w=>w<560?1.35:1,c:['Trigonometry','Geometry'],run:polar}
];

cv.onpointerdown=e=>{if(S[cur].run!==unit)return;cv.setPointerCapture(e.pointerId);drag=true;setPlay(false);ang(e)};
cv.onpointermove=e=>{if(drag)ang(e)};
cv.onpointerup=cv.onpointercancel=()=>{drag=false};

let lw=0;new ResizeObserver(()=>{const w=cv.parentElement.clientWidth;if(w!==lw){lw=w;fit()}}).observe(cv.parentElement);
fit();select(0);requestAnimationFrame(frame);
